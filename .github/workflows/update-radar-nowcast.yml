name: Mise à jour Radar + Carte temps réel

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: radar-nowcast-production
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances radar
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.33.0 numpy==2.4.6 h5py pyproj opencv-python-headless pillow

      - name: Vérifier la version du moteur radar
        run: |
          grep -q "AM_RADAR_MAP_5_0" scripts/update_radar_nowcast.py
          echo "Radar Map V5.0 chargé"

      - name: Calculer le nowcast et la carte radar
        env:
          METEOFRANCE_RADAR_TOKEN: ${{ secrets.METEOFRANCE_RADAR_TOKEN }}
          LOG_LEVEL: INFO
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_radar_nowcast.py --catalog config/communes-france.json --output-dir build/radar --downsample 4 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done
      - name: Vérifier les sorties
        run: |
          test -f build/radar/index.json
          test -f build/radar/map/index.json
          test -f build/radar/map/obs_p0.png
          ls -lh build/radar/map/

      - name: Publier sur la branche radar-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R build/radar/. "$publish_dir/"
          git init -b radar-data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -m "Mise à jour radar + carte"
          git -C "$publish_dir" push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:radar-data

      # Contrairement à radar-data (ci-dessus, écrasée à chaque run pour l'affichage en direct),
      # radar-archive n'est jamais force-push : les observations pluie s'y accumulent (pas le
      # nowcast, qui est du calcul dérivé sans valeur d'archive) sur une fenêtre glissante d'1 an
      # (purge au-delà dans archive_radar_rain.py).
      - name: Archiver les observations radar pluie (rétention 1 an)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive_dir="$(mktemp -d)"
          if git clone --quiet --depth 1 --branch radar-archive \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$archive_dir" 2>/dev/null; then
            echo "Branche radar-archive existante."
          else
            echo "Création de la branche radar-archive."
            git init -q -b radar-archive "$archive_dir"
          fi
          if python scripts/archive_radar_rain.py build/radar "$archive_dir"; then
            git -C "$archive_dir" config user.name "github-actions[bot]"
            git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$archive_dir" add -A pluie
            git -C "$archive_dir" commit -q -m "Archive radar pluie $(date -u +'%Y-%m-%d %H:%M UTC')"
            git -C "$archive_dir" push -q \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              radar-archive
          else
            echo "Rien de nouveau à archiver/purger."
          fi
