name: Update Vigilance Météo-France

on:
  workflow_dispatch:
  schedule:
    - cron: '6,21,36,51 * * * *'

permissions:
  contents: write

concurrency:
  group: update-vigilance-meteofrance
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vérifier l'authentification configurée
        shell: bash
        env:
          MF_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID }}
          MF_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          MF_LEGACY_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}
        run: |
          if [ -n "$MF_APPLICATION_ID" ]; then
            if [[ "$MF_APPLICATION_ID" == eyJ*.*.* ]]; then
              echo "::error::METEOFRANCE_APPLICATION_ID ressemble à un token/API Key JWT (eyJ...). Ce n'est pas l'APPLICATION_ID. Copiez la chaîne après Authorization: Basic dans le curl OAuth2 du portail Météo-France."
              exit 1
            fi
            echo "Authentification : APPLICATION_ID (renouvellement OAuth2 automatique)"
          elif [ -n "$MF_API_KEY" ]; then
            echo "Authentification : API Key"
          elif [ -n "$MF_LEGACY_TOKEN" ]; then
            echo "::warning::METEOFRANCE_TOKEN est un mode de secours. Un token généré dans le portail peut expirer après environ 1 heure."
          else
            echo "::error::Ajoutez METEOFRANCE_APPLICATION_ID (recommandé) ou METEOFRANCE_API_KEY dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Télécharger la vigilance Météo-France
        env:
          METEOFRANCE_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID }}
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_vigilance.py 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Vérifier le JSON généré
        shell: bash
        run: |
          test -s data/vigilance.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/vigilance.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          product = data.get("carte", {}).get("product", {})
          periods = product.get("periods", [])
          terms = {
              str(period.get("echeance", "")).upper()
              for period in periods
              if isinstance(period, dict)
          }
          assert "J" in terms, "Échéance J absente"
          assert all(
              isinstance((period.get("timelaps") or {}).get("domain_ids"), list)
              and (period.get("timelaps") or {}).get("domain_ids")
              for period in periods
              if isinstance(period, dict)
          ), "Une période ne contient aucun domaine"
          print("JSON vigilance valide :", sorted(terms))
          PY

      - name: Commit si la vigilance a changé
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/vigilance.json)" ]; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vigilance.json
          git commit -m "Mise à jour vigilance Météo-France"
          git push
