name: Update Carte Pluie Météo-France

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Important : ne plus annuler une exécution déjà en cours.
# Cela évite le message "The operation was canceled" lorsqu'une autre
# exécution planifiée arrive pendant la précédente.
concurrency:
  group: carte-pluie-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer le cache climatologique précédent
        shell: bash
        run: |
          git fetch origin observations || true
          git show origin/observations:cache_pluie_climatologie.json \
            > cache_pluie_climatologie.json 2>/dev/null || true
          git show origin/observations:cache_pluie_horaire.json \
            > cache_pluie_horaire.json 2>/dev/null || true

      - name: Générer observations_pluie.json (mode rapide)
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.35"
          MF_BUILD_ARCHIVES: "0"
        run: |
          python generer_pluie_meteofrance.py

      - name: Vérifier le JSON v2.3.2
        shell: bash
        run: |
          test -s observations_pluie.json
          test -s cache_pluie_climatologie.json
          test -s cache_pluie_horaire.json

          python - <<'PY'
          import json

          with open("observations_pluie.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert data["schema_version"] >= 5
          assert data["module_version"] == "2.3.2"
          assert isinstance(data["stations"], list)
          assert data["stations_total"] > 0

          required_metrics = {
              "rr24", "rr48", "rr72",
              "rr_month_current", "rr_season_current", "rr_year_current",
              "rr_daily_record", "rr_month_mean", "rr_year_mean",
          }
          missing = required_metrics - set(data.get("metrics", {}))
          assert not missing, f"Métriques absentes : {sorted(missing)}"

          sapc = [
              s for s in data["stations"]
              if "SAPC" in str(s.get("name", "")).upper()
          ]
          assert not sapc, f"Stations SAPC encore présentes : {len(sapc)}"

          print("JSON v2.3.2 valide")
          print("Stations :", data["stations_total"])
          print("RR24 :", data.get("stations_rr24"))
          print("RR48 :", data.get("stations_rr48"))
          print("RR72 :", data.get("stations_rr72"))
          print("Records disponibles :", data.get("stations_records"))
          PY

      - name: Préparer la publication
        shell: bash
        run: |
          mkdir -p /tmp/carte-pluie-publish
          cp observations_pluie.json /tmp/carte-pluie-publish/
          cp cache_pluie_climatologie.json /tmp/carte-pluie-publish/
          cp cache_pluie_horaire.json /tmp/carte-pluie-publish/

      - name: Publier sur la branche observations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ne jamais basculer le worktree courant : il contient les JSON générés
          # et Git refuserait le checkout s'ils existent déjà sur observations.
          PUBLISH_DIR="/tmp/carte-pluie-observations"
          rm -rf "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git worktree add --force -B observations-publish "$PUBLISH_DIR" origin/observations
          else
            mkdir -p "$PUBLISH_DIR"
            git -C "$PUBLISH_DIR" init
            git -C "$PUBLISH_DIR" remote add origin "$(git remote get-url origin)"
            git -C "$PUBLISH_DIR" checkout --orphan observations-publish
          fi

          cp /tmp/carte-pluie-publish/observations_pluie.json "$PUBLISH_DIR"/
          cp /tmp/carte-pluie-publish/cache_pluie_climatologie.json "$PUBLISH_DIR"/
          cp /tmp/carte-pluie-publish/cache_pluie_horaire.json "$PUBLISH_DIR"/

          git -C "$PUBLISH_DIR" add observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json

          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi

          git -C "$PUBLISH_DIR" commit -m "Mise à jour carte pluie Météo-France v2.3.2"
          git -C "$PUBLISH_DIR" push origin HEAD:observations
