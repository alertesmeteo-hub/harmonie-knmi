name: Update Carte Pluie Météo-France

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-pluie-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier cohérence v2.6.0
        run: |
          grep -q 'VERSION = "2.6.0"' generer_pluie_meteofrance.py
          grep -q 'VERSION = "2.6.0"' verifier_cache_pluie.py

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: pip install requests==2.33.0

      - name: Récupérer les caches précédents
        run: |
          git fetch origin observations
          git show origin/observations:cache_pluie_horaire.json > cache_pluie_horaire.json
          git show origin/observations:cache_pluie_climatologie.json > cache_pluie_climatologie.json 2>/dev/null || echo '{"schema_version":5,"stations":{}}' > cache_pluie_climatologie.json

      - name: Refuser un cache 48/72 h non initialisé
        run: python verifier_cache_pluie.py --min-depth 72 --require-48 --require-72

      - name: Ajouter les nouvelles RR1 Météo-France et recalculer les fenêtres
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.35"
          MF_BUILD_ARCHIVES: "0"
          MF_BOOTSTRAP_HOURLY: "0"
          MF_REFRESH_DAILY: "0"
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python generer_pluie_meteofrance.py 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Vérifier le JSON
        run: |
          python verifier_cache_pluie.py --min-depth 72 --require-48 --require-72
          python - <<'PY'
          import json
          d=json.load(open('observations_pluie.json',encoding='utf-8'))
          assert d.get('status') == 'ok'
          assert d.get('module_version') == '2.6.0'
          assert d.get('stations_rr24',0)>0
          assert d.get('stations_rr48',0)>0
          assert d.get('stations_rr72',0)>0
          assert str(d.get('source',{}).get('observations','')).startswith('Météo-France')
          print('Météo-France RR24/RR48/RR72 :',d.get('stations_rr24'),d.get('stations_rr48'),d.get('stations_rr72'))
          PY

      - name: Préparer publication
        run: |
          mkdir -p /tmp/carte-pluie-publish
          cp observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json /tmp/carte-pluie-publish/

      - name: Publier sur observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3 4; do
            echo "Publication tentative ${attempt}/4..."
            publish_dir="$(mktemp -d)"
            git clone --quiet --depth 1 --branch observations "$REPO_URL" "$publish_dir"
            cp /tmp/carte-pluie-publish/* "$publish_dir"/
            git -C "$publish_dir" add observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json
            if git -C "$publish_dir" diff --cached --quiet; then
              echo "Aucun changement à publier."
              exit 0
            fi
            git -C "$publish_dir" commit -m "Mise à jour pluie glissante Météo-France v2.6.0"
            if git -C "$publish_dir" push origin HEAD:observations; then
              echo "Publication réussie."
              exit 0
            fi
            echo "::warning::Conflit de publication (autre workflow concurrent) ; nouvel essai."
            rm -rf "$publish_dir"
            sleep $((attempt * 3))
          done
          echo "::error::Échec de publication après 4 tentatives."
          exit 1
