name: Update Carte Pluie Météo-France

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-pluie-meteofrance
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # IMPORTANT :
      # on ne touche pas au requirements.txt HARMONIE.
      # Le générateur pluie n'a besoin que de requests.
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer le cache climatologique précédent
        shell: bash
        run: |
          git fetch origin observations || true
          git show origin/observations:cache_pluie_climatologie.json \
            > cache_pluie_climatologie.json 2>/dev/null || true

      - name: Générer observations_pluie.json
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
        run: |
          python generer_pluie_meteofrance.py

      - name: Vérifier les fichiers
        shell: bash
        run: |
          test -s observations_pluie.json
          test -s cache_pluie_climatologie.json

          python - <<'PY'
          import json

          with open("observations_pluie.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert isinstance(data["stations"], list)
          assert data["stations_total"] > 0

          print("JSON valide")
          print("Stations :", data["stations_total"])
          print("Stations RR24 :", data["stations_rr24"])
          print("Max 24h :", data["metrics"]["rr24"]["max"], "mm")
          PY

      - name: Préparer la publication
        shell: bash
        run: |
          mkdir -p /tmp/carte-pluie-publish
          cp observations_pluie.json /tmp/carte-pluie-publish/
          cp cache_pluie_climatologie.json /tmp/carte-pluie-publish/

      - name: Publier sur la branche observations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/carte-pluie-publish/observations_pluie.json .
          cp /tmp/carte-pluie-publish/cache_pluie_climatologie.json .

          git add observations_pluie.json cache_pluie_climatologie.json

          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi

          git commit -m "Mise à jour carte pluie Météo-France"
          git push origin observations
