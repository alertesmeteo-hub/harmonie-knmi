name: Test Package Observations V2

on:
  workflow_dispatch:

jobs:
  test_package_obs_v2:
    runs-on: ubuntu-24.04

    steps:
      - name: Tester Package Observations V2
        shell: bash
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
        run: |
          set -euo pipefail

          RAW="${METEOFRANCE_PACKAGE_OBS_KEY:-}"

          if [ -z "$RAW" ]; then
            echo "ERREUR : METEOFRANCE_PACKAGE_OBS_KEY est vide."
            exit 1
          fi

          KEY="$(printf '%s' "$RAW" \
            | tr -d '\r\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          KEY="${KEY#Bearer }"
          KEY="${KEY#bearer }"
          KEY="${KEY#apikey: }"
          KEY="${KEY#apiKey: }"

          URL="https://public-api.meteofrance.fr/public/DPPaquetObs/v2/paquet/stations/horaire?format=csv"

          echo "Clé Package Observations : détectée"
          echo "Longueur : ${#KEY} caractères"
          echo "Test V2 : ${URL}"

          HTTP_CODE="$(curl -sS \
            --connect-timeout 15 \
            --max-time 90 \
            -D /tmp/mf_headers \
            -o /tmp/mf_package \
            -w "%{http_code}" \
            -H "accept: */*" \
            -H "apikey: ${KEY}" \
            "${URL}")"

          echo "HTTP : ${HTTP_CODE}"
          echo "Taille : $(wc -c < /tmp/mf_package) octets"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "PACKAGE OBSERVATIONS V2 : OK"
            echo "Content-Type : $(grep -i '^content-type:' /tmp/mf_headers | tail -1 | tr -d '\r' || true)"
            echo "Début de la réponse :"
            head -c 600 /tmp/mf_package || true
            echo
            exit 0
          fi

          echo "Réponse Météo-France :"
          head -c 1000 /tmp/mf_package || true
          echo
          exit 1
