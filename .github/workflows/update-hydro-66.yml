name: Rivières 66 (hauteurs et débits)

on:
  workflow_dispatch:
  schedule:
    # Déclenchement réel toutes les 15 min depuis le VPS ; ce cron n'est qu'un filet de sécurité.
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: hydro-66
  cancel-in-progress: false

jobs:
  hydro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lire Hub'Eau et Vigicrues
        id: lire
        run: |
          set -o pipefail
          pip install --disable-pip-version-check -q "requests>=2.32,<3"
          reseau='injoignable|RemoteDisconnected|Connection(Error|Reset|refused| aborted)|ReadTimeout|ConnectTimeout|HTTP ?(Error)?:? ?(429|500|502|503|504)|timed out'
          for attempt in 1 2 3; do
            if python scripts/update_hydro_66.py --out-dir build/hydro \
                 --previous-url "https://raw.githubusercontent.com/${{ github.repository }}/hydro-data/66.json" 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              echo "publier=1" >> "$GITHUB_OUTPUT"
              break
            fi
            if ! grep -qiE "$reseau" "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              # Hub'Eau en panne (21 octobre 2026 : connexions coupées pendant des heures). Les données déjà publiées
              # restent en ligne : on ne signale un échec (et un courriel) que si elles ont plus de 6 h.
              age_h=$(python scripts/age_publication.py "https://raw.githubusercontent.com/${{ github.repository }}/hydro-data/66.json" || echo 999)
              if [ "$age_h" -lt 6 ]; then
                echo "::warning::Hub'Eau injoignable : données précédentes gardées (publiées il y a ${age_h} h)."
                exit 0
              fi
              echo "::error::Hub'Eau injoignable et données publiées il y a ${age_h} h"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 60 s"
            sleep 60
          done

      - name: Publier la branche hydro-data
        if: steps.lire.outputs.publier == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R build/hydro/. "$publish_dir/"
          git init -q -b hydro-data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -q -m "Rivières 66 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # GitHub refuse parfois un push côté serveur (« fatal error in commit_refs », 12 octobre 2026 à 23:09 UTC) : nouvel essai.
          for attempt in 1 2 3; do
            if git -C "$publish_dir" push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:hydro-data; then
              exit 0
            fi
            echo "::warning::Push refusé (tentative ${attempt}/3), nouvel essai."
            sleep $((attempt * 10))
          done
          echo "::error::Échec de publication après 3 tentatives."
          exit 1
