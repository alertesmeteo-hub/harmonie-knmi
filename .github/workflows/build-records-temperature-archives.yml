name: Build Archives Carte Records Température

on:
  schedule:
    - cron: '42 3 * * *'
  workflow_dispatch:
    inputs:
      year_month:
        description: 'Mois à reconstruire (YYYY-MM) ou current'
        required: true
        default: 'current'
        type: string
      bootstrap_count:
        description: 'Nombre de départements historiques à initialiser'
        required: true
        default: '8'
        type: string

permissions:
  contents: write

concurrency:
  group: records-temperature-archives
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer caches et archives existants
        shell: bash
        run: |
          rm -rf /tmp/records-state
          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git clone --depth 1 --branch observations "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/records-state
            if [ -d /tmp/records-state/records_temperature ]; then
              rm -rf records_temperature
              cp -a /tmp/records-state/records_temperature ./records_temperature
            fi
          fi

      - name: Initialiser historiques et construire le mois
        shell: bash
        env:
          INPUT_MONTH: ${{ inputs.year_month }}
          INPUT_BOOTSTRAP: ${{ inputs.bootstrap_count }}
        run: |
          month="${INPUT_MONTH:-current}"
          count="${INPUT_BOOTSTRAP:-8}"
          python generer_records_temperature.py --bootstrap-next "$count" --archive "$month"

          # Du 1er au 3 du mois, on reconstruit aussi le mois précédent pour
          # intégrer les dernières données quotidiennes expertisées.
          if [ "$month" = "current" ] && [ "$(date -u +%d)" -le 3 ]; then
            prev="$(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          d=datetime.now(timezone.utc).replace(day=1)-timedelta(days=1)
          print(d.strftime('%Y-%m'))
          PY
          )"
            python generer_records_temperature.py --archive "$prev"
          fi

      - name: Contrôler index
        run: |
          test -s records_temperature/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('records_temperature/index.json').read_text(encoding='utf-8'))
          assert d['status']=='ok'
          print('Couverture :', d['coverage_departments'], '/', d['coverage_target'])
          print('Mois disponibles :', len(d.get('available_months',[])))
          PY

      - name: Publier sur observations
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          pub="$(mktemp -d)"
          git clone --depth 1 --branch observations "$REPO_URL" "$pub" 2>/dev/null || {
            git init -b observations "$pub"
            git -C "$pub" remote add origin "$REPO_URL"
          }
          rm -rf "$pub/records_temperature"
          cp -a records_temperature "$pub/records_temperature"
          git -C "$pub" config user.name "github-actions[bot]"
          git -C "$pub" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pub" add records_temperature
          if git -C "$pub" diff --cached --quiet; then exit 0; fi
          git -C "$pub" commit -m "Archives records température v1.0.0"
          git -C "$pub" push origin observations
