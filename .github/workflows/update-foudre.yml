name: Mise à jour Foudre (MTG Lightning Imager)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Rattrapage des impacts (heures d'historique, 0 = aucun)"
        default: "0"
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: write

concurrency:
  group: foudre-lfl
  cancel-in-progress: false

jobs:
  foudre:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-foudre.txt

      - name: Installer les dépendances foudre
        run: python -m pip install --disable-pip-version-check -r requirements-foudre.txt

      # L'état (cumuls jour / mois / année, produits déjà traités) vit dans la branche foudre-data :
      # on le relit avant chaque passage pour que les cumuls continuent d'un run à l'autre.
      - name: Restaurer l'état précédent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git clone --quiet --depth 1 --branch foudre-data \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null; then
            cp state/cache_foudre_lfl.json . 2>/dev/null || true
            cp state/observations_foudre_lfl.json . 2>/dev/null || true
            cp state/impacts_foudre_lfl.json . 2>/dev/null || true
            echo "État restauré."
          else
            echo "Pas d'état précédent : premier lancement."
          fi

      - name: Lire la foudre EUMETSAT
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          FOUDRE_BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours || '0' }}
        run: |
          if [ -z "$EUMETSAT_CONSUMER_KEY" ] || [ -z "$EUMETSAT_CONSUMER_SECRET" ]; then
            echo "::warning title=Secrets EUMETSAT manquants::Ajoutez EUMETSAT_CONSUMER_KEY et EUMETSAT_CONSUMER_SECRET."
            exit 0
          fi
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python generer_foudre_lfl.py 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|TooManyRedirects|Exceeded 30 redirects|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Publier sur la branche foudre-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f observations_foudre_lfl.json || { echo "Rien à publier."; exit 0; }
          python - <<'PY'
          import json
          d = json.load(open("observations_foudre_lfl.json", encoding="utf-8"))
          assert d["status"] == "ok"
          print("Validation OK :", d.get("generated_at"))
          PY
          publish_dir="$(mktemp -d)"
          cp observations_foudre_lfl.json "$publish_dir/"
          cp cache_foudre_lfl.json "$publish_dir/" 2>/dev/null || true
          cp impacts_foudre_lfl.json impacts_24h.json "$publish_dir/" 2>/dev/null || true
          git init -q -b foudre-data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -q -m "Foudre MTG LI $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Branche écrasée à chaque passage : seul l'état courant compte, pas d'historique à conserver.
          git -C "$publish_dir" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:foudre-data
          git -C "$publish_dir" rev-parse HEAD > "$RUNNER_TEMP/foudre-commit"

      # Alerte « orage à proximité » du SaaS : contrôle lancé dès la publication, sur la version exacte qui vient
      # d'être écrite (adresse au numéro de commit, que le cache de raw.githubusercontent.com ne sert jamais périmée).
      # Sans le secret CRON_SECRET, l'étape est sautée : le contrôle du quart d'heure (lancer-modeles) reste le secours.
      # Dépôt public : on n'affiche que le code HTTP et des compteurs, jamais le détail du bilan (noms de clients).
      - name: Prévenir le SaaS (alerte orage)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET absent : contrôle laissé au passage du quart d'heure."; exit 0; fi
          commit=$(cat "$RUNNER_TEMP/foudre-commit" 2>/dev/null || true)
          if [ -z "$commit" ]; then echo "Rien de publié à ce passage."; exit 0; fi
          code=$(curl -sS -o "$RUNNER_TEMP/orage.json" -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://app.alertes-meteo.com/api/cron/orage-proche?commit=$commit") || code="échec"
          python - "$RUNNER_TEMP/orage.json" "$code" <<'PY'
          import json, sys
          code = sys.argv[2]
          try:
              b = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              b = {}
          f = b.get("foudre") or {}
          print(f"Contrôle orage : HTTP {code} ; communes {b.get('communes', '?')}, alertes {b.get('alertes', '?')}, SMS {b.get('sms', '?')}, e-mails {b.get('emails', '?')}, erreurs {len(b.get('erreurs') or [])} ; foudre générée {f.get('genere', '?')}, lue {f.get('lu', '?')}")
          if code != "200":
              print(f"::warning title=Contrôle orage::HTTP {code}")
          PY

      # Archives quotidiennes des impacts (une par jour UTC, ~quelques dizaines de Ko) :
      # branche foudre-archives, jamais écrasée, on y ajoute/met à jour les fichiers du jour.
      - name: Archiver les impacts du jour
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ls archives/*.json >/dev/null 2>&1 || { echo "Pas d'archive à écrire."; exit 0; }
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf arch
          if ! git clone --quiet --depth 1 --branch foudre-archives "$url" arch 2>/dev/null; then
            git init -q -b foudre-archives arch
            git -C arch remote add origin "$url"
          fi
          mkdir -p arch/archives
          cp archives/*.json arch/archives/
          git -C arch config user.name "github-actions[bot]"
          git -C arch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C arch add -A
          if git -C arch diff --cached --quiet; then echo "Archives inchangées."; exit 0; fi
          git -C arch commit -q -m "Archives foudre $(date -u +'%Y-%m-%d %H:%M UTC')"
          git -C arch push -q origin HEAD:foudre-archives
