name: Update Classements Observations Météo-France

on:
  schedule:
    # Mise à jour horaire après la diffusion du relevé horaire Météo-France.
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classements-temperature
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0 "pypdf>=5.0,<7"

      - name: Récupérer cache 72 h
        shell: bash
        run: |
          git fetch origin observations || true
          git show origin/observations:cache_classements_temperature_72h.json \
            > cache_classements_temperature_72h.json 2>/dev/null || true
          git show origin/observations:cache_qualite_sites_mf.json \
            > cache_qualite_sites_mf.json 2>/dev/null || true
          git show origin/observations:cache_normales_records_mf.json \
            > cache_normales_records_mf.json 2>/dev/null || true

          if [ -s cache_classements_temperature_72h.json ]; then
            echo "Cache 72 h récupéré."
          else
            echo "Premier lancement : cache absent."
            rm -f cache_classements_temperature_72h.json
          fi

      - name: Tester le générateur
        run: |
          python tests/test_generateur_observations.py

      - name: Générer les classements températures
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.15"
          MF_METADATA_BATCH_SIZE: "60"
          MF_METADATA_DELAY: "0.10"
        run: |
          python generer_classements_temperature.py

      - name: Contrôler les sorties
        shell: bash
        run: |
          set -euo pipefail
          test -s classements_temperature.json
          test -s cache_classements_temperature_72h.json

          python - <<'PY'
          import json

          with open("classements_temperature.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert data["schema_version"] >= 2
          assert data["module_version"] == "1.1.0"
          assert data["build_id"] == "classements-observations-mf-complet-20260821"
          assert data["latest_observation_at"]
          assert isinstance(data.get("hourly"), list)
          assert len(data["hourly"]) > 0, "Aucun classement horaire"

          required = (
              "tn_provisoire",
              "tn_18_06",
              "tn_06_18",
              "tn_finales",
              "tx_provisoire",
              "tx_06_18",
              "tx_18_06",
              "tx_finales",
          )

          for key in required:
              assert key in data["tables"], f"Table absente : {key}"
              table = data["tables"][key]
              assert "rows" in table
              assert "period_label" in table
              if table.get("stations", 0) == 0:
                  print(f"::warning::{key} encore indisponible : cache en cours de constitution")
              elif not table.get("complete", False) and not table.get("provisional", False):
                  print(
                      f"::warning::{key} partiel : "
                      f"{table.get('coverage_hours')}/{table.get('expected_hours')} h"
                  )

          print("=== CLASSEMENTS TEMPÉRATURES ===")
          print("Dernier relevé :", data["latest_observation_at"])
          print("Heures cache :", data["cache"]["hours_retained"])
          print("Classements horaires :", len(data["hourly"]))
          for key in required:
              t = data["tables"][key]
              print(
                  key,
                  ":",
                  t.get("stations"),
                  "stations ;",
                  t.get("coverage_hours"),
                  "/",
                  t.get("expected_hours"),
                  "h",
              )
          PY

      - name: Préparer publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/classements-temperature-publish

          cp classements_temperature.json \
            /tmp/classements-temperature-publish/classements_temperature.json
          cp cache_classements_temperature_72h.json \
            /tmp/classements-temperature-publish/cache_classements_temperature_72h.json
          cp cache_qualite_sites_mf.json \
            /tmp/classements-temperature-publish/cache_qualite_sites_mf.json
          cp cache_normales_records_mf.json \
            /tmp/classements-temperature-publish/cache_normales_records_mf.json

          # Évite le blocage git switch par des fichiers non suivis.
          rm -f classements_temperature.json
          rm -f cache_classements_temperature_72h.json
          rm -f cache_qualite_sites_mf.json
          rm -f cache_normales_records_mf.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/classements-temperature-publish/classements_temperature.json .
          cp /tmp/classements-temperature-publish/cache_classements_temperature_72h.json .
          cp /tmp/classements-temperature-publish/cache_qualite_sites_mf.json .
          cp /tmp/classements-temperature-publish/cache_normales_records_mf.json .

          git add \
            classements_temperature.json \
            cache_classements_temperature_72h.json \
            cache_qualite_sites_mf.json \
            cache_normales_records_mf.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Classements observations Météo-France v1.1.0"
          if ! git push origin observations; then
            echo "Push concurrent détecté, nouvel essai..."
            git fetch origin observations
            git rebase origin/observations
            git push origin observations
          fi
