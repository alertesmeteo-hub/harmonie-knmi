name: Mise à jour HARMONIE France

on:
  workflow_dispatch:
  schedule:
    # Les heures planifiées par GitHub sont toujours en UTC.
    - cron: "27 * * * *"

permissions:
  contents: write

concurrency:
  group: harmonie-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    # La première archive peut être volumineuse ; les passages suivants
    # s'arrêtent vite tant que le KNMI n'a pas publié un nouveau run.
    timeout-minutes: 180

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer ecCodes et les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Vérifier le moteur avant le téléchargement KNMI
        run: |
          python -c "import eccodes, numpy, PIL, requests, scipy"
          python -m py_compile scripts/harmonie_maps.py scripts/update_harmonie_france.py
          python -m unittest discover -s tests -v
          node --check wordpress/harmonie-knmi-widget/assets/harmonie-map.js
          node tests/test_map_widget.js
          HKM_DISABLE_WEBGL=1 node tests/test_map_widget.js

      - name: Télécharger et décoder HARMONIE pour toutes les communes
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          LOG_LEVEL: INFO
        run: >-
          python scripts/update_harmonie_france.py
          --catalog config/communes-france.json
          --output-dir build/national
          --forecast-hours 48

      - name: Publier les fichiers nationaux sur la branche data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f build/national/index.json ]]; then
            echo "Aucune nouvelle échéance nationale à publier."
            exit 0
          fi

          publish_dir="$(mktemp -d)"
          cp -R build/national/. "$publish_dir/"
          git init -b data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -m "Mise à jour HARMONIE France"
          git -C "$publish_dir" push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:data
