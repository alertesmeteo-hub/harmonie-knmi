name: Update Observations Pluie 24h

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_and_upload:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Génération de la carte HTML
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python generer_obs_24h.py

      - name: Publier la carte sur la branche observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp observations_pluie_24h.html "$publish_dir/"
          cd "$publish_dir"
          git init -b observations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observations_pluie_24h.html
          git commit -m "Mise à jour de la carte des observations"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:observations
