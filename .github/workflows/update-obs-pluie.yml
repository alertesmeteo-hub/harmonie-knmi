name: Update Observations Pluie 24h

on:
  schedule:
    # Exécution toutes les heures à la minute 15 (ex: 12h15, 13h15...)
    - cron: '15 * * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'interface GitHub

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # ou la version que tu utilises habituellement

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib cartopy

      - name: Génération de la carte des observations 24h
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python generer_obs_24h.py

      - name: Envoi FTP vers le site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Assure-toi que ces secrets existent déjà dans ton dépôt GitHub
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # On n'envoie que le fichier spécifique de la carte générée
          local-dir: ./
          # Dossier distant sur ton WordPress (à adapter selon ta structure habituelle, ex: wp-content/uploads/meteo/)
          server-dir: ./wp-content/uploads/
          exclude: |
            **/*
            !observations_pluie_24h.png
