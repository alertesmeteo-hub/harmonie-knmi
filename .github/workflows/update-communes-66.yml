name: Prévisions multi-modèles par commune (66)

on:
  workflow_dispatch:
  schedule:
    # Toutes les heures : les modèles publient à des heures différentes, la synthèse suit.
    - cron: "25 * * * *"

permissions:
  contents: write

concurrency:
  group: communes-66
  cancel-in-progress: false

jobs:
  communes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Synthèse des modèles par commune
        run: |
          set -o pipefail
          pip install --disable-pip-version-check -q "requests>=2.32,<3"
          for attempt in 1 2 3; do
            if python scripts/build_communes_66.py --out-dir build/communes 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|ReadTimeout|ConnectTimeout|HTTP ?(Error)?:? ?(429|500|502|503|504)|timed out|Seulement' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur passagère (tentative $attempt), nouvelle tentative dans 60 s"
            sleep 60
          done

      - name: Publier la branche communes-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R build/communes/. "$publish_dir/"
          git init -q -b communes-data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -q -m "Communes 66 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git -C "$publish_dir" push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:communes-data
