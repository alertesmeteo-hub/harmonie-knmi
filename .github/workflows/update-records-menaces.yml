name: Update Records Température Menacés

# Prévisions de nos modèles (AROME, ARPEGE, ICON, CEP) ramenées aux stations et comparées aux records à battre
# (records_temperature/references.json, produit par le workflow LIVE). Sorties sur la branche records-menaces-data
# (poussée à chaque passage, sans historique) : menaces.json pour la page, etat.json = mémoire des écarts prévu - mesuré.

on:
  workflow_dispatch:
  schedule:
    - cron: '25 1,4,7,10,13,16,19,22 * * *'

permissions:
  contents: write

concurrency:
  group: records-menaces
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer l'état précédent
        shell: bash
        run: |
          rm -rf /tmp/menaces-state
          mkdir -p /tmp/menaces-state
          if git ls-remote --exit-code --heads origin records-menaces-data >/dev/null 2>&1; then
            git clone --depth 1 --branch records-menaces-data "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/menaces-state
          fi

      - name: Calculer les records menacés
        shell: bash
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          ETAT=""
          if [ -f /tmp/menaces-state/etat.json ]; then ETAT="--etat /tmp/menaces-state/etat.json"; fi
          for attempt in 1 2 3; do
            if python generer_records_menaces.py $ETAT --sortie records_menaces 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|ECONNRESET|ETIMEDOUT|EAI_AGAIN|timed out|Read timed|indisponible|references.json introuvable' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Contrôler les sorties
        shell: bash
        run: |
          test -s records_menaces/menaces.json
          test -s records_menaces/etat.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('records_menaces/menaces.json').read_text(encoding='utf-8'))
          assert m['status'] == 'ok'
          assert m['module_version'] == '1.0.0'
          assert m['days'], 'aucun jour prévu'
          assert len(m['models']) >= 2, 'moins de deux modèles lus'
          for jour, d in m['days'].items():
              assert d['stations_with_values'] >= 1000, (jour, d['stations_with_values'])
              c = d['counts']
              print(jour, '| chaleur', c['heat'], '(', c['heat_records'], 'probables ) | froid', c['cold'], '(', c['cold_records'], ') | nuits tropicales', c['tropical'], '(', c['tropical_records'], ')')
          print('Modèles :', [(x['id'], x['debut']) for x in m['models']])
          print('Correction :', m['correction'])
          PY

      - name: Publier sur records-menaces-data
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            pub="$(mktemp -d)"
            git init -b records-menaces-data "$pub"
            git -C "$pub" remote add origin "$REPO_URL"
            cp records_menaces/menaces.json records_menaces/etat.json "$pub/"
            git -C "$pub" config user.name "github-actions[bot]"
            git -C "$pub" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$pub" add menaces.json etat.json
            git -C "$pub" commit -m "Records température menacés v1.0.0"
            if git -C "$pub" push --force origin records-menaces-data; then exit 0; fi
            rm -rf "$pub"
            sleep $((attempt * 3))
          done
          exit 1
