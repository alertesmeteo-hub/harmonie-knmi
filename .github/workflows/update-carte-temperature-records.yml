name: Update Carte Températures Ressentis et Records

on:
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-temperature-records
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer le cache records
        shell: bash
        run: |
          git fetch origin observations || true
          git show origin/observations:cache_temperature_records.json \
            > cache_temperature_records.json 2>/dev/null || true

      - name: Générer observations_temperature.json
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.15"
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python generer_temperature_records.py 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Vérifier les métriques
        shell: bash
        run: |
          test -s observations_temperature.json
          test -s cache_temperature_records.json

          python - <<'PY'
          import json

          with open("observations_temperature.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert data["schema_version"] >= 3
          assert data["module_version"] == "1.2.0"
          assert data["stations_total"] > 0

          required = (
              "temperature",
              "variation_24h",
              "min_12h",
              "min_24h",
              "max_12h",
              "max_24h",
              "humidex",
              "wind_feels_like",
          )

          for field in required:
              assert field in data["metrics"], f"Métrique absente : {field}"

          for field in (
              "temperature",
              "min_12h",
              "min_24h",
              "max_12h",
              "max_24h",
          ):
              n = data["metrics"][field].get("stations", 0)
              assert n > 100, f"{field} insuffisant : {n}"

          nvar = data["metrics"]["variation_24h"].get("stations", 0)
          assert nvar > 100, f"variation_24h insuffisante : {nvar}"

          print("=== CONTRÔLE JSON ===")
          print("Version :", data["module_version"])
          print("Stations :", data["stations_total"])

          for field in required:
              print(
                  field,
                  ":",
                  data["metrics"][field].get("stations", "n/a"),
                  "station(s)"
              )
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/temp-publish

          cp observations_temperature.json \
            /tmp/temp-publish/observations_temperature.json

          cp cache_temperature_records.json \
            /tmp/temp-publish/cache_temperature_records.json

          # IMPORTANT :
          # ces fichiers sont non suivis sur la branche courante.
          # On les retire avant de basculer vers la branche observations,
          # sinon git switch refuse d'écraser les fichiers existants.
          rm -f observations_temperature.json
          rm -f cache_temperature_records.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/temp-publish/observations_temperature.json .
          cp /tmp/temp-publish/cache_temperature_records.json .

          git add observations_temperature.json cache_temperature_records.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Températures, ressentis et records v1.2.0"
          git push origin observations
