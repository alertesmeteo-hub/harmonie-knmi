name: Update Radar Neige et Limite Pluie-Neige

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: radar-neige-lpn
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-radar-neige.txt

      - name: Vérifier générateur
        run: |
          test -s scripts/update_radar_neige.py
          python scripts/update_radar_neige.py --self-test

      - name: Récupérer animation précédente
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/radar-neige-previous
          mkdir -p /tmp/radar-neige-previous
          if git ls-remote --exit-code --heads origin radar-neige-data >/dev/null 2>&1; then
            git fetch origin radar-neige-data
            git archive origin/radar-neige-data | tar -x -C /tmp/radar-neige-previous
            echo "Historique précédent récupéré."
          else
            echo "Premier lancement : aucune branche radar-neige-data."
          fi

      - name: Générer radar neige
        env:
          METEOFRANCE_RADAR_TOKEN: ${{ secrets.METEOFRANCE_RADAR_TOKEN }}
          METEOFRANCE_AROME_PI_TOKEN: ${{ secrets.METEOFRANCE_AROME_PI_TOKEN }}
          METEOFRANCE_AROME_TOKEN: ${{ secrets.METEOFRANCE_AROME_TOKEN }}
        run: |
          python scripts/update_radar_neige.py \
            --output-dir build/radar-neige \
            --previous-dir /tmp/radar-neige-previous

      - name: Contrôler production
        shell: bash
        run: |
          test -s build/radar-neige/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/radar-neige/index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] == 'ok'
          assert data['module_version'] == '1.0.0'
          assert data['build_id'] == 'radar-neige-lpn-mf-aromepi-20260820'
          frames = data.get('frames') or []
          assert frames, 'aucune image radar neige'
          for item in frames:
              assert (p.parent / item['file']).is_file(), item['file']
          print('Images animation :', len(frames))
          print('Dernier radar :', data.get('radar_time'))
          print('AROME-PI phase :', (data.get('phase') or {}).get('status'))
          if (data.get('phase') or {}).get('status') != 'ok':
              print('::warning::AROME-PI incomplet : le radar reste publié en mode dégradé.')
          if not (data.get('lpn') or {}).get('available'):
              print('::warning::Limite pluie/neige indisponible sur ce run.')
          PY

      - name: Préparer publication
        run: |
          rm -rf /tmp/radar-neige-publish
          mkdir -p /tmp/radar-neige-publish
          cp -a build/radar-neige/. /tmp/radar-neige-publish/

      - name: Publier branche radar-neige-data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BRANCH="radar-neige-data"
          publish_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$publish_dir"
            find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git init -b "$BRANCH" "$publish_dir"
            git -C "$publish_dir" remote add origin "$REPO_URL"
          fi

          cp -a /tmp/radar-neige-publish/. "$publish_dir/"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add -A

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi

          git -C "$publish_dir" commit -m "Radar neige et limite pluie-neige v1.0.0"

          for attempt in 1 2 3; do
            if git -C "$publish_dir" push origin "$BRANCH"; then
              exit 0
            fi
            echo "Push concurrent, tentative ${attempt}/3..."
            git -C "$publish_dir" fetch origin "$BRANCH" || true
            git -C "$publish_dir" rebase "origin/$BRANCH" || true
            sleep $((attempt * 3))
          done
          exit 1
