name: Update Cumuls Quotidiens Pluie

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-pluie-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: pip install requests==2.33.0

      - name: Récupérer les caches existants
        run: |
          git fetch origin observations
          git show origin/observations:cache_pluie_horaire.json > cache_pluie_horaire.json
          git show origin/observations:cache_pluie_climatologie.json > cache_pluie_climatologie.json 2>/dev/null || echo '{"schema_version":5,"stations":{}}' > cache_pluie_climatologie.json

      - name: Vérifier le cache glissant
        run: python verifier_cache_pluie.py --min-depth 72 --require-48 --require-72

      - name: Mettre à jour mois saison année et RR24/RR48/RR72
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.35"
          MF_BUILD_ARCHIVES: "0"
          MF_BOOTSTRAP_HOURLY: "0"
          MF_REFRESH_DAILY: "1"
        run: python generer_pluie_meteofrance.py

      - name: Vérifier
        run: |
          python verifier_cache_pluie.py --min-depth 72 --require-48 --require-72
          python - <<'PY'
          import json
          d=json.load(open('observations_pluie.json',encoding='utf-8'))
          assert d.get('module_version')=='2.6.0'
          assert d.get('stations_total',0)>0
          assert d.get('stations_rr48',0)>0
          assert d.get('stations_rr72',0)>0
          assert str(d.get('source',{}).get('observations','')).startswith('Météo-France')
          print('Cumuls quotidiens + glissants OK pour',d['stations_total'],'stations')
          PY

      - name: Préparer publication
        run: |
          mkdir -p /tmp/carte-pluie-publish
          cp observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json /tmp/carte-pluie-publish/

      - name: Publier sur observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISH_DIR="/tmp/carte-pluie-observations"
          rm -rf "$PUBLISH_DIR"
          git fetch origin observations
          git worktree add --force -B observations-publish "$PUBLISH_DIR" origin/observations
          cp /tmp/carte-pluie-publish/* "$PUBLISH_DIR"/
          git -C "$PUBLISH_DIR" add observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then exit 0; fi
          git -C "$PUBLISH_DIR" commit -m "Mise à jour cumuls pluie Météo-France v2.6.0"
          git -C "$PUBLISH_DIR" push origin HEAD:observations
