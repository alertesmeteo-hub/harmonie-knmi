name: Update Cumuls Quotidiens Pluie

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-pluie-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Récupérer les caches existants
        shell: bash
        run: |
          git fetch origin observations || true
          git show origin/observations:cache_pluie_climatologie.json > cache_pluie_climatologie.json 2>/dev/null || true
          git show origin/observations:cache_pluie_horaire.json > cache_pluie_horaire.json 2>/dev/null || true

      - name: Mettre à jour mois saison année
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.35"
          MF_BUILD_ARCHIVES: "0"
          MF_BOOTSTRAP_HOURLY: "0"
          MF_REFRESH_DAILY: "1"
        run: |
          python generer_pluie_meteofrance.py

      - name: Vérifier
        run: |
          test -s observations_pluie.json
          test -s cache_pluie_climatologie.json
          test -s cache_pluie_horaire.json
          python - <<'PY'
          import json
          with open('observations_pluie.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d['module_version']=='2.3.3'
          assert d['stations_total']>0
          print('Cumuls quotidiens mis à jour pour', d['stations_total'], 'stations')
          PY

      - name: Préparer publication
        run: |
          mkdir -p /tmp/carte-pluie-publish
          cp observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json /tmp/carte-pluie-publish/

      - name: Publier sur observations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISH_DIR="/tmp/carte-pluie-observations"
          rm -rf "$PUBLISH_DIR"
          git fetch origin observations || true
          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git worktree add --force -B observations-publish "$PUBLISH_DIR" origin/observations
          else
            mkdir -p "$PUBLISH_DIR"
            git -C "$PUBLISH_DIR" init
            git -C "$PUBLISH_DIR" remote add origin "$(git remote get-url origin)"
            git -C "$PUBLISH_DIR" checkout --orphan observations-publish
          fi
          cp /tmp/carte-pluie-publish/* "$PUBLISH_DIR"/
          git -C "$PUBLISH_DIR" add observations_pluie.json cache_pluie_climatologie.json cache_pluie_horaire.json
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then exit 0; fi
          git -C "$PUBLISH_DIR" commit -m "Mise à jour cumuls quotidiens pluie v2.3.3"
          git -C "$PUBLISH_DIR" push origin HEAD:observations
