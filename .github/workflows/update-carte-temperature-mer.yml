name: Update Carte Température Mer DENSE v1.1.0

on:
  workflow_dispatch:
  schedule:
    - cron: '36 * * * *'

permissions:
  contents: write

concurrency:
  group: carte-temperature-mer-dense-v110
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Vérifier générateur v1.1.0
        shell: bash
        run: |
          test -s generer_temperature_mer.py

          python - <<'PY'
          from pathlib import Path

          text = Path(
              "generer_temperature_mer.py"
          ).read_text(encoding="utf-8")

          if 'VERSION = "1.1.0"' not in text:
              raise SystemExit(
                  "ERREUR : generer_temperature_mer.py "
                  "n'est pas la v1.1.0 DENSE."
              )

          if (
              'BUILD_ID = "temperature-mer-dense-ship-buoy-20260820"'
              not in text
          ):
              raise SystemExit(
                  "ERREUR : mauvais build température mer."
              )

          print(
              "OK : générateur température mer "
              "DENSE v1.1.0."
          )
          PY

      - name: Récupérer cache 72 h
        shell: bash
        run: |
          git fetch origin observations || true

          git show \
            origin/observations:cache_temperature_mer_72h.json \
            > cache_temperature_mer_72h.json 2>/dev/null || true

          if [ -s cache_temperature_mer_72h.json ]; then
            echo "Cache température mer récupéré."
          else
            echo "Aucun cache existant."
            rm -f cache_temperature_mer_72h.json
          fi

      - name: Générer température mer dense
        run: |
          python generer_temperature_mer.py

      - name: Contrôler JSON
        shell: bash
        run: |
          test -s observations_temperature_mer.json
          test -s cache_temperature_mer_72h.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "observations_temperature_mer.json"
              ).read_text(encoding="utf-8")
          )

          print("=== TEMPÉRATURE MER DENSE ===")
          print("Status :", data.get("status"))
          print("Version :", data.get("module_version"))
          print("Schema :", data.get("schema_version"))
          print("Build :", data.get("build_id"))
          print("Points :", data.get("stations_total"))
          print(
              "Types :",
              data.get("coverage", {}).get(
                  "platforms_current"
              ),
          )
          print(
              "Sources :",
              data.get("coverage", {}).get(
                  "sources_current"
              ),
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "ERREUR : status JSON != ok"
              )

          if data.get("module_version") != "1.1.0":
              raise SystemExit(
                  "ERREUR : module_version != 1.1.0"
              )

          if data.get("schema_version") != 2:
              raise SystemExit(
                  "ERREUR : schema_version != 2"
              )

          required = (
              "sea_temp_c",
              "variation_24h_c",
              "min_24h_c",
              "max_24h_c",
              "min_72h_c",
              "max_72h_c",
          )

          metrics = data.get("metrics") or {}

          for field in required:
              if field not in metrics:
                  raise SystemExit(
                      "ERREUR : métrique absente : "
                      + field
                  )

              print(
                  field,
                  ":",
                  metrics[field].get("stations"),
                  "point(s)"
              )

          if not metrics["sea_temp_c"].get("stations"):
              raise SystemExit(
                  "ERREUR : aucune température "
                  "de mer exploitable."
              )

          print(
              "OK : JSON température mer "
              "DENSE v1.1.0."
          )
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/temp-mer-publish

          cp observations_temperature_mer.json \
            /tmp/temp-mer-publish/

          cp cache_temperature_mer_72h.json \
            /tmp/temp-mer-publish/

          rm -f observations_temperature_mer.json
          rm -f cache_temperature_mer_72h.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/temp-mer-publish/observations_temperature_mer.json .
          cp /tmp/temp-mer-publish/cache_temperature_mer_72h.json .

          git add \
            observations_temperature_mer.json \
            cache_temperature_mer_72h.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Température mer DENSE v1.1.0"

          if ! git push origin observations; then
            echo "Push concurrent : nouvel essai."
            git fetch origin observations
            git rebase origin/observations
            git push origin observations
          fi
