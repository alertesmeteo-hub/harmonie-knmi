name: Update Foudre LFL EUMETSAT v1.0.0

on:
  workflow_dispatch:
  schedule:
    # LFL est archivé dans le Data Store par chunks de 10 minutes.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: foudre-lfl-eumetsat-v100
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer dépendances LFL
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0 eumdac netCDF4 numpy shapely

      - name: Vérifier secrets EUMETSAT
        shell: bash
        run: |
          if [ -z "${EUMETSAT_CONSUMER_KEY:-}" ]; then
            echo "ERREUR : secret EUMETSAT_CONSUMER_KEY absent."
            exit 1
          fi

          if [ -z "${EUMETSAT_CONSUMER_SECRET:-}" ]; then
            echo "ERREUR : secret EUMETSAT_CONSUMER_SECRET absent."
            exit 1
          fi

          echo "Secrets EUMETSAT présents."

      - name: Vérifier générateur
        shell: bash
        run: |
          test -s generer_foudre_lfl.py

          python - <<'PY'
          from pathlib import Path

          text = Path(
              "generer_foudre_lfl.py"
          ).read_text(encoding="utf-8")

          checks = (
              'VERSION = "1.0.0"',
              'SCHEMA_VERSION = 1',
              'BUILD_ID = "mtg-li-lfl-france-stats-20260820"',
              'COLLECTION_ID = "EO:EUM:DAT:0691"',
          )

          for check in checks:
              if check not in text:
                  raise SystemExit(
                      "ERREUR générateur : "
                      + check
                  )

          print(
              "OK : générateur Foudre LFL v1.0.0"
          )
          PY

      - name: Récupérer cache précédent
        shell: bash
        run: |
          git fetch origin observations || true

          git show \
            origin/observations:cache_foudre_lfl.json \
            > cache_foudre_lfl.json 2>/dev/null || true

          if [ -s cache_foudre_lfl.json ]; then
            echo "Cache Foudre LFL récupéré."
          else
            echo "Premier lancement : reconstruction du jour."
            rm -f cache_foudre_lfl.json
          fi

      - name: Générer statistiques Foudre LFL
        run: |
          python generer_foudre_lfl.py

      - name: Contrôler JSON
        shell: bash
        run: |
          test -s observations_foudre_lfl.json
          test -s cache_foudre_lfl.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "observations_foudre_lfl.json"
              ).read_text(encoding="utf-8")
          )

          print("=== FOUDRE LFL ===")
          print("Status :", data.get("status"))
          print("Version :", data.get("module_version"))
          print("Schema :", data.get("schema_version"))
          print("Build :", data.get("build_id"))
          print(
              "Aujourd'hui :",
              data.get("periods", {})
                  .get("today", {})
                  .get("total")
          )
          print(
              "Mois :",
              data.get("periods", {})
                  .get("month", {})
                  .get("total")
          )
          print(
              "Année :",
              data.get("periods", {})
                  .get("year", {})
                  .get("total")
          )
          print(
              "Produits trouvés :",
              data.get("diagnostics", {})
                  .get("products_found_this_run")
          )
          print(
              "Produits nouveaux :",
              data.get("diagnostics", {})
                  .get("products_new_this_run")
          )
          print(
              "Flashes lus :",
              data.get("diagnostics", {})
                  .get("flashes_read_this_run")
          )
          print(
              "Flashes France attribués :",
              data.get("diagnostics", {})
                  .get("flashes_attributed_this_run")
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "ERREUR : status != ok"
              )

          if data.get("module_version") != "1.0.0":
              raise SystemExit(
                  "ERREUR : module_version != 1.0.0"
              )

          if data.get("schema_version") != 1:
              raise SystemExit(
                  "ERREUR : schema_version != 1"
              )

          if (
              data.get("source", {})
                  .get("collection_id")
              != "EO:EUM:DAT:0691"
          ):
              raise SystemExit(
                  "ERREUR : mauvaise collection EUMETSAT"
              )

          print("OK : JSON Foudre LFL.")
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/foudre-lfl-publish

          cp observations_foudre_lfl.json \
            /tmp/foudre-lfl-publish/

          cp cache_foudre_lfl.json \
            /tmp/foudre-lfl-publish/

          rm -f observations_foudre_lfl.json
          rm -f cache_foudre_lfl.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/foudre-lfl-publish/observations_foudre_lfl.json .
          cp /tmp/foudre-lfl-publish/cache_foudre_lfl.json .

          git add \
            observations_foudre_lfl.json \
            cache_foudre_lfl.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Foudre LFL EUMETSAT v1.0.0"

          if ! git push origin observations; then
            echo "Push concurrent : nouvel essai."
            git fetch origin observations
            git rebase origin/observations
            git push origin observations
          fi
