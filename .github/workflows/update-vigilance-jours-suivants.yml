name: Mise à jour vigilance jours suivants

on:
  workflow_dispatch:
  schedule:
    # Météo-France émet le bulletin vers 06h30 et 12h45 (heure de Paris).
    # On repasse en fin de journée pour rattraper une éventuelle réémission.
    - cron: '20 5,11,15,20 * * *'

permissions:
  contents: write

concurrency:
  group: vigilance-jours-suivants
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test de non-régression (bulletin de référence, hors ligne)
        run: python tests/test_parse.py

      - name: Générer le JSON J+2 à J+7
        env:
          VJS_RETRIES: '3'
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_vjs.py 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Contrôler le fichier publié
        run: python scripts/check_data.py data/vigilance-jours-suivants.json

      - name: Publier uniquement si les données ont changé
        run: |
          if git diff --quiet -- data/vigilance-jours-suivants.json; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git config user.name "alertesmeteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vigilance-jours-suivants.json
          git commit -m "Vigilance jours suivants — $(python -c "import json;print(json.load(open('data/vigilance-jours-suivants.json'))['bulletin']['issued_label'])")"
          git push
