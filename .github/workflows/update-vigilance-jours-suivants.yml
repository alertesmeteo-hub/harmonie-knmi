name: Mise à jour vigilance jours suivants

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4,10,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: vigilance-jours-suivants
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Générer le JSON J+2 à J+7
        env:
          VJS_MF_URL: https://vigilance.meteofrance.fr/fr
          VJS_REFERENCE_URL: https://meteo-npdc.fr/vigilance-jours-suivants
          VJS_ALLOW_REFERENCE_FALLBACK: '1'
          VJS_RETRIES: '2'
        run: python scripts/update_vjs.py

      - name: Contrôler le JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/vigilance-jours-suivants.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version'] == 2
          assert [x['label'] for x in d['cards']] == ['J+2','J+3','J+4','J+5','J+6 et J+7']
          for c in d['cards']:
              assert len(c['departments']) >= 96, (c['label'], len(c['departments']))
              assert all(v['probability'] in {'none','low','medium','high'} for v in c['departments'].values())
          print('Contrôle OK : 5 cartes et 96 départements par échéance.')
          PY

      - name: Publier uniquement si les données ont changé
        run: |
          if git diff --quiet -- data/vigilance-jours-suivants.json; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git config user.name "alertesmeteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vigilance-jours-suivants.json
          git commit -m "Mise à jour vigilance jours suivants"
          git push
