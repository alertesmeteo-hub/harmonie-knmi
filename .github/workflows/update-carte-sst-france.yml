name: Update Carte SST France MUR v1.0.2

on:
  workflow_dispatch:
  schedule:
    # Une fois par jour.
    # 20:45 UTC = 22:45 en été / 21:45 en hiver en France.
    - cron: '45 20 * * *'

permissions:
  contents: write

concurrency:
  group: carte-sst-france-mur-v102
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer dépendances SST
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0 numpy matplotlib netCDF4

      - name: Vérifier générateur
        shell: bash
        run: |
          test -s generer_sst_france.py

          python - <<'PY'
          from pathlib import Path

          text = Path(
              "generer_sst_france.py"
          ).read_text(encoding="utf-8")

          checks = (
              'VERSION = "1.0.2"',
              'SCHEMA_VERSION = 1',
              'BUILD_ID = "sst-france-mur-oceanmask-v102-20260820"',
              'DATASET_ID = "jplMURSST41"',
          )

          for check in checks:
              if check not in text:
                  raise SystemExit(
                      "ERREUR générateur : "
                      + check
                  )

          print(
              "OK : générateur SST France v1.0.1"
          )
          PY

      - name: Générer raster SST France
        run: |
          python generer_sst_france.py

      - name: Contrôler sorties
        shell: bash
        run: |
          test -s sst_france.png
          test -s sst_france_metadata.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "sst_france_metadata.json"
              ).read_text(encoding="utf-8")
          )

          print("=== SST FRANCE ===")
          print("Status :", data.get("status"))
          print("Version :", data.get("module_version"))
          print("Schema :", data.get("schema_version"))
          print("Build :", data.get("build_id"))
          print("Analyse :", data.get("analysis_time"))
          print(
              "Résolution :",
              data.get("render", {}).get(
                  "resolution_label"
              ),
          )
          print(
              "Grille :",
              data.get("render", {}).get(
                  "width_cells"
              ),
              "x",
              data.get("render", {}).get(
                  "height_cells"
              ),
          )
          print(
              "Min/Max :",
              data.get("stats", {}).get(
                  "min_c"
              ),
              "/",
              data.get("stats", {}).get(
                  "max_c"
              ),
              "°C",
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "ERREUR : status != ok"
              )

          if data.get("module_version") != "1.0.2":
              raise SystemExit(
                  "ERREUR : mauvaise version v1.0.2"
              )

          if data.get("schema_version") != 1:
              raise SystemExit(
                  "ERREUR : mauvais schema"
              )

          if not data.get("analysis_time"):
              raise SystemExit(
                  "ERREUR : date analyse absente"
              )

          render = data.get("render") or {}

          if render.get("ocean_only_classes") != [1, 8]:
              raise SystemExit(
                  "ERREUR : masque océan strict absent"
              )

          if render.get("cell_edge_bounds") is not True:
              raise SystemExit(
                  "ERREUR : bounds demi-pixel absents"
              )

          print(
              "Masque océan strict : classes 1 et 8 uniquement"
          )
          print(
              "Bounds : bords de cellules (demi-pixel corrigé)"
          )

          if not data.get("render", {}).get("land_mask_applied"):
              raise SystemExit(
                  "ERREUR : masque terre/mer non appliqué"
              )

          print("Masque terre/mer : OK")

          png = Path("sst_france.png")

          if png.stat().st_size < 5000:
              raise SystemExit(
                  "ERREUR : PNG anormalement petit"
              )

          print("OK : SST France prête.")
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/sst-france-publish

          cp sst_france.png \
            /tmp/sst-france-publish/

          cp sst_france_metadata.json \
            /tmp/sst-france-publish/

          rm -f sst_france.png
          rm -f sst_france_metadata.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/sst-france-publish/sst_france.png .
          cp /tmp/sst-france-publish/sst_france_metadata.json .

          git add \
            sst_france.png \
            sst_france_metadata.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "SST France MUR v1.0.2"

          if ! git push origin observations; then
            echo "Push concurrent : nouvel essai."
            git fetch origin observations
            git rebase origin/observations
            git push origin observations
          fi
