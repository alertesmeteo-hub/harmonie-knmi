name: Update Carte Crues Vigicrues v1.0.3

on:
  workflow_dispatch:
    inputs:
      bootstrap_thresholds:
        description: "Recalcul complet des seuils historiques (plus long)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: update-crues-vigicrues
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.33.0 beautifulsoup4==4.13.4

      - name: Générer les données
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bootstrap_thresholds }}" = "true" ]; then
            EXTRA="--bootstrap-thresholds"
          fi
          python scripts/update_crues.py --out data $EXTRA

      - name: Contrôles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('data/meta.json'),
              Path('data/troncons.geojson'),
              Path('data/stations.json'),
              Path('data/live.json'),
              Path('data/historical_thresholds.json'),
          ]
          for path in required:
              assert path.exists(), f"Fichier manquant: {path}"
              assert path.stat().st_size > 0, f"Fichier vide: {path}"

          meta = json.loads(Path('data/meta.json').read_text(encoding='utf-8'))
          assert meta['troncon_count'] > 250, meta
          assert meta['station_count'] > 3000, meta
          assert Path('data/troncons.geojson').stat().st_size > 100_000
          assert Path('data/stations.json').stat().st_size > 100_000
          print(meta)
          PY

      - name: Commit des données si changement
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: mise à jour Vigicrues / Hub'Eau"
          git push
