name: Update Carte Vent et Rafales Météo-France

on:
  schedule:
    - cron: '14 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-vent-rafales-meteofrance
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Générer observations_rafales.json
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.30"
        run: |
          python generer_rafales_meteofrance.py

      - name: Vérifier le JSON
        shell: bash
        run: |
          test -s observations_rafales.json

          python - <<'PY'
          import json

          with open("observations_rafales.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert data["module_version"] == "1.1.0"
          assert data["stations_total"] > 0

          required = (
              "latest_gust_kmh",
              "gust_24h_kmh",
              "gust_72h_kmh",
              "latest_mean_wind_kmh",
              "mean_wind_24h_max_kmh",
              "mean_wind_72h_max_kmh",
          )

          for field in required:
              assert field in data["metrics"], f"Métrique manquante : {field}"
              assert data["metrics"][field]["stations"] > 0, \
                  f"Aucune station pour {field}"

          print("=== CONTRÔLE VENT / RAFALES ===")
          print("Version :", data["module_version"])
          print("Stations :", data["stations_total"])

          for field in required:
              print(
                  field,
                  ":",
                  data["metrics"][field]["stations"],
                  "stations ; max",
                  data["metrics"][field]["max"],
                  "km/h",
              )
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/rafales-publish

          cp observations_rafales.json \
            /tmp/rafales-publish/observations_rafales.json

          rm -f observations_rafales.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/rafales-publish/observations_rafales.json .

          git add observations_rafales.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise à jour vent et rafales v1.1.0"
          git push origin observations
