name: Update Carte Rafales Météo-France

on:
  schedule:
    - cron: '14 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carte-rafales-meteofrance
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Générer observations_rafales.json
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.30"
        run: |
          python generer_rafales_meteofrance.py

      - name: Vérifier le JSON
        shell: bash
        run: |
          test -s observations_rafales.json

          python - <<'PY'
          import json

          with open("observations_rafales.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["status"] == "ok"
          assert data["module_version"] == "1.0.0"
          assert data["stations_total"] > 0

          for field in (
              "latest_gust_kmh",
              "gust_24h_kmh",
              "gust_72h_kmh",
          ):
              assert field in data["metrics"]
              assert data["metrics"][field]["stations"] > 0

          sapc = [
              s for s in data["stations"]
              if "SAPC" in str(s.get("name", "")).upper()
          ]
          assert not sapc, f"SAPC restantes : {len(sapc)}"

          print("=== CONTRÔLE RAFALES ===")
          print("Version :", data["module_version"])
          print("Stations :", data["stations_total"])
          print(
              "Paquets chargés :",
              data["coverage"]["packages_loaded"],
              "/",
              data["coverage"]["packages_requested"],
          )

          for field in (
              "latest_gust_kmh",
              "gust_24h_kmh",
              "gust_72h_kmh",
          ):
              print(
                  field,
                  ":",
                  data["metrics"][field]["stations"],
                  "stations ; max",
                  data["metrics"][field]["max"],
                  "km/h",
              )
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/rafales-publish
          cp observations_rafales.json /tmp/rafales-publish/observations_rafales.json
          rm -f observations_rafales.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/rafales-publish/observations_rafales.json .
          git add observations_rafales.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise à jour rafales Météo-France"
          git push origin observations
