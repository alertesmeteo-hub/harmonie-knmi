name: Test API Observations Météo-France V2 - API Key

on:
  workflow_dispatch:

jobs:
  test_api:
    runs-on: ubuntu-24.04

    steps:
      - name: Tester la clé API Observation V2
        shell: bash
        env:
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
        run: |
          set -euo pipefail

          RAW="${METEOFRANCE_OBS_TOKEN:-}"

          if [ -z "$RAW" ]; then
            echo "ERREUR : METEOFRANCE_OBS_TOKEN est vide."
            exit 1
          fi

          KEY="$(printf '%s' "$RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          # Si quelqu'un a collé "Bearer " ou "apikey: " devant, on nettoie.
          KEY="${KEY#Bearer }"
          KEY="${KEY#bearer }"
          KEY="${KEY#apikey: }"
          KEY="${KEY#apiKey: }"

          echo "Secret détecté : oui"
          echo "Longueur après nettoyage : ${#KEY} caractères"
          echo "Test DPObs V2 avec authentification API Key..."

          HTTP_CODE="$(curl -sS \
            --connect-timeout 15 \
            --max-time 45 \
            -o /tmp/mf_stations \
            -w "%{http_code}" \
            -H "accept: */*" \
            -H "apikey: ${KEY}" \
            "https://public-api.meteofrance.fr/public/DPObs/v2/liste-stations")"

          echo "HTTP Météo-France : ${HTTP_CODE}"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "API Observations V2 : OK avec API Key"
            echo "Taille de la réponse : $(wc -c < /tmp/mf_stations) octets"
            exit 0
          fi

          echo "Réponse :"
          head -c 1000 /tmp/mf_stations || true
          echo

          echo "Le test API Key a échoué."
          exit 1
