name: Update Vent et Rafales API Météo-France

on:
  workflow_dispatch:
  schedule:
    - cron: '14 * * * *'

permissions:
  contents: write

concurrency:
  group: vent-rafales-api-meteofrance
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.33.0

      - name: Vérifier générateur v1.2.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("generer_rafales_meteofrance.py")
          text = p.read_text(encoding="utf-8")

          if 'VERSION = "1.2.1"' not in text:
              raise SystemExit(
                  "ERREUR : generer_rafales_meteofrance.py "
                  "n'est pas la version 1.2.1."
              )

          if 'BUILD_ID = "vent-rafales-api-mf-cache-72h-20260821"' not in text:
              raise SystemExit(
                  "ERREUR : mauvais build du générateur."
              )

          print("OK : générateur v1.2.1 API Météo-France.")
          PY

      - name: Tests du générateur
        run: |
          python tests/test_generer_rafales.py

      - name: Récupérer cache 72h
        shell: bash
        run: |
          git fetch origin observations || true

          git show \
            origin/observations:cache_vent_rafales_72h.json \
            > cache_vent_rafales_72h.json 2>/dev/null || true

          if [ -s cache_vent_rafales_72h.json ]; then
            echo "Cache 72 h récupéré."
          else
            echo "Premier lancement : aucun cache existant."
            rm -f cache_vent_rafales_72h.json
          fi

      - name: Générer vent et rafales
        env:
          METEOFRANCE_PACKAGE_OBS_KEY: ${{ secrets.METEOFRANCE_PACKAGE_OBS_KEY }}
          METEOFRANCE_OBS_TOKEN: ${{ secrets.METEOFRANCE_OBS_TOKEN }}
          MF_PACKAGE_DELAY: "1.50"
        run: |
          python generer_rafales_meteofrance.py

      - name: Contrôler JSON
        shell: bash
        run: |
          test -s observations_rafales.json
          test -s cache_vent_rafales_72h.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("observations_rafales.json").read_text(
                  encoding="utf-8"
              )
          )

          print("=== JSON ===")
          print("Status :", data.get("status"))
          print("Version :", data.get("module_version"))
          print("Schema :", data.get("schema_version"))
          print("Build :", data.get("build_id"))
          print("Stations :", data.get("stations_total"))
          print(
              "Appels API paquets ce run :",
              data.get("coverage", {}).get(
                  "api_packages_this_run"
              ),
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "ERREUR : status JSON != ok"
              )

          if data.get("module_version") != "1.2.1":
              raise SystemExit(
                  "ERREUR : module_version != 1.2.1"
              )

          if data.get("schema_version") != 3:
              raise SystemExit(
                  "ERREUR : schema_version != 3"
              )

          required = (
              "latest_gust_kmh",
              "gust_24h_kmh",
              "gust_72h_kmh",
              "latest_mean_wind_kmh",
              "mean_wind_24h_max_kmh",
              "mean_wind_72h_max_kmh",
          )

          metrics = data.get("metrics") or {}

          for field in required:
              item = metrics.get(field)

              if not item:
                  raise SystemExit(
                      "ERREUR : métrique absente : "
                      + field
                  )

              print(
                  field,
                  ":",
                  item.get("stations"),
                  "station(s) ; max",
                  item.get("max"),
                  "km/h"
              )

          # Au premier run, 24h/72h ne sont pas encore pleines.
          # Seules les données actuelles sont obligatoires.
          if not metrics["latest_gust_kmh"].get("stations"):
              raise SystemExit(
                  "ERREUR : aucune rafale actuelle."
              )

          if not metrics["latest_mean_wind_kmh"].get("stations"):
              raise SystemExit(
                  "ERREUR : aucun vent moyen actuel."
              )

          print("OK : JSON stable généré.")
          PY

      - name: Préparer publication
        shell: bash
        run: |
          mkdir -p /tmp/vent-rafales-publish

          cp observations_rafales.json \
            /tmp/vent-rafales-publish/

          cp cache_vent_rafales_72h.json \
            /tmp/vent-rafales-publish/

          rm -f observations_rafales.json
          rm -f cache_vent_rafales_72h.json

      - name: Publier branche observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations
            git switch -C observations origin/observations
          else
            git switch --orphan observations
            git rm -rf . || true
          fi

          cp /tmp/vent-rafales-publish/observations_rafales.json .
          cp /tmp/vent-rafales-publish/cache_vent_rafales_72h.json .

          git add \
            observations_rafales.json \
            cache_vent_rafales_72h.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Vent et rafales API Météo-France v1.2.1"

          # Petit retry si un autre workflow a publié sur observations
          # pendant notre exécution.
          if ! git push origin observations; then
            echo "Push concurrent détecté, nouvel essai..."

            git fetch origin observations
            git rebase origin/observations
            git push origin observations
          fi
