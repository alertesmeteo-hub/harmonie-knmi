name: Update frise pluie multi-modèles v1.0.0
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6,12,18,0 * * *'
permissions: {contents: write}
concurrency: {group: multi-modeles-v100, cancel-in-progress: true}
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install requests==2.33.0
      - run: python scripts/build_multi_modeles.py --output build/multi-modeles/index.json
      - run: python -c "import json; d=json.load(open('build/multi-modeles/index.json')); assert d['status']=='ok' and len(d['series']) >= 2"
      - name: Publier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin observations
          git switch -C observations origin/observations
          rm -rf multi-modeles
          mkdir multi-modeles
          cp build/multi-modeles/index.json multi-modeles/index.json
          git add multi-modeles
          git diff --cached --quiet && exit 0
          git commit -m "Update frise pluie multi-modèles"
          git push origin observations || (git fetch origin observations && git rebase origin/observations && git push origin observations)
